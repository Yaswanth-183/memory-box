<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Memory - Memory Box</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

    <header>
        <h1>Memory Box - Add Memory</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="view_memory.html">View Memory</a></li>
            </ul>
        </nav>
    </header>

    <h2>Add a New Memory</h2>

    <div>
        <form id="memoryForm">
            <label for="title">Memory Title:</label>
            <input type="text" id="title" placeholder="Enter memory title" required>
            <br><br>

            <label for="description">Description:</label>
            <textarea id="description" placeholder="Describe your memory" required></textarea>
            <br><br>

            <label for="date">Date:</label>
            <input type="date" id="date" required>
            <br><br>

            <label for="file">Upload File:</label>
            <input type="file" id="file" accept="image/*,video/*">
            <br><br>

            <button type="button" id="saveMemoryBtn">Save Memory</button>
            <button type="reset" id="resetBtn">Reset</button>
        </form>
    </div>

    <div id="message"></div>

    <footer>
        <p>&copy; 2024 Memory Box. All rights reserved.</p>
    </footer>

    <script>
        $(document).ready(function () {
            // Show welcome alert
            alert("Welcome! Add your memory.");

            // Keyup event for title input
            $("#title").keyup(function () {
                console.log("Typing in title: " + $(this).val());
            });

            // Focus event when user clicks on description
            $("#description").focus(function () {
                $(this).css("background-color", "#e0f7fa"); // Light blue
            });

            // Blur event when user clicks outside description
            $("#description").blur(function () {
                $(this).css("background-color", ""); // Reset color
            });

            // Change event when selecting a date
            $("#date").change(function () {
                alert("You selected the date: " + $(this).val());
            });

            // Change event when selecting a file
            $("#file").change(function () {
                if (this.files.length > 0) {
                    alert("File selected: " + this.files[0].name);
                }
            });

            // Click event for save button (Now with no AJAX)
            $("#saveMemoryBtn").on("click", function () {
                let title = $("#title").val();
                let description = $("#description").val();
                let date = $("#date").val();
                let file = $("#file")[0].files.length > 0 ? $("#file")[0].files[0].name : "";

                if (!title || !description || !date || !file) {
                    alert("Please fill all fields and upload a file!");
                    return;
                }

                // Simulated successful memory save
                $("#message").html("<p style='color:green;'>Memory Saved Successfully!</p>");
            });

            // Click event for reset button
            $("#resetBtn").click(function () {
                $("#message").html(""); // Clear message
                alert("Form Reset!");
            });
        });
    </script>

</body>
</html>
